# Copy this file to config.yaml and adjust as needed.
# When running the executable, pass: tally --config /path/to/config.yaml

# Maximum active seconds credited per person per day. Omit or set to null to disable.
max_daily_active_seconds: 21600  # 6 hours

# Base points per full hour of active time
base_points_per_hour: 1

# Bonus points at each time threshold (minutes, points)
point_thresholds:
  - minutes: 30
    points: 5
  - minutes: 60
    points: 2
  - minutes: 120
    points: 1

# User streak: bonus points for every N consecutive days with at least 1 point
user_streak_bonus_points: 5
user_streak_interval_days: 7

# Team bonus when all members earn at least 1 point that day
team_bonus_points: 5

# Seconds between Strava API requests (rate limiting)
strava_request_interval_seconds: 5
